[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto_applier"
version = "0.1.0"
description = "Auto job applier with Claude-powered resume tailoring"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "typer[all]>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "weasyprint>=63.0",
    "python-docx>=1.1.0",
    "pdfminer.six>=20240706",
    "rapidfuzz>=3.10.0",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
playwright = ["playwright>=1.48.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
auto_applier = "auto_applier.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_applier = ["tailor/templates/*.j2", "tailor/templates/*.css", "approval/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
